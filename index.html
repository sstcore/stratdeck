<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07090f">
<meta name="referrer" content="no-referrer">
<title>StratDeck — Strategy Console</title>
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://ss-strat-dash-8f21.s3.eu-west-1.amazonaws.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Ambient background -->
  <div class="ambient" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="gridlines"></div>
  </div>

  <!-- ============ LOGIN ============ -->
  <main id="login" class="login">
    <div class="login-card">
      <div class="brand" aria-label="StratDeck">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
          <defs>
            <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#34e0a1"/>
              <stop offset="1" stop-color="#38bdf8"/>
            </linearGradient>
          </defs>
          <path d="M20 2 L37 11 V29 L20 38 L3 29 V11 Z" fill="none" stroke="url(#markGrad)" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M12 24 L17 18 L21 21 L28 13" fill="none" stroke="url(#markGrad)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name">StratDeck</span>
      </div>

      <h1>Unlock your console</h1>
      <p class="login-sub">Enter your password to view the strategy dashboard.</p>

      <form id="loginForm" class="login-form" method="post" autocomplete="on">
        <!-- Username field is only here so Google/Chrome Password Manager can match
             and autofill this login. It is never used for authentication. -->
        <input type="text" id="username" name="username" autocomplete="username"
          class="visually-hidden" value="strategist" tabindex="-1" aria-hidden="true">

        <label class="field-label" for="passwordInput">Password</label>
        <div class="key-wrap">
          <svg class="key-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <input type="password" id="passwordInput" name="password" autocomplete="current-password"
            placeholder="Enter password" spellcheck="false" autocapitalize="off" required>
        </div>

        <button id="unlockBtn" class="btn btn-primary" type="submit">
          <span class="btn-label">Unlock dashboard</span>
        </button>
      </form>

      <p id="loginStatus" class="login-status" role="status" aria-live="polite"></p>

      <div class="login-foot">
        <span class="dot" aria-hidden="true"></span>
        Data is fetched as public ciphertext and decrypted locally in this tab.
      </div>
    </div>
  </main>

  <!-- ============ APP ============ -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="brand brand-small" aria-label="StratDeck">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
          <path d="M20 2 L37 11 V29 L20 38 L3 29 V11 Z" fill="none" stroke="url(#markGrad)" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M12 24 L17 18 L21 21 L28 13" fill="none" stroke="url(#markGrad)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name">StratDeck</span>
      </div>

      <nav id="nav" class="nav" aria-label="Strategies"></nav>

      <div class="topbar-actions">
        <button id="refreshBtn" class="btn btn-ghost" type="button" title="Re-fetch and re-decrypt">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 6.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Refresh</span>
        </button>
        <button id="lockBtn" class="btn btn-ghost" type="button" title="Lock and return to the login screen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>Lock</span>
        </button>
      </div>
    </header>

    <div class="statusbar">
      <span id="portfolioSummary" class="portfolio-summary"></span>
      <span class="statusbar-right">
        <span id="staleBadge" class="badge" aria-live="polite"></span>
        <span id="asOfBadge" class="badge badge-dim" title="Latest snapshot time (UTC)"></span>
      </span>
    </div>

    <main id="content" class="content"></main>

    <footer class="footer">
      <span>Data is encrypted at rest and decrypted in-browser &middot; auto-refreshes when a new snapshot is published (~5 min)</span>
      <span id="generatedAt" class="footer-meta"></span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
